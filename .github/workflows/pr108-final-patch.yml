name: PR108 final dispatch-contract patch
on:
  push:
    branches: [xt/xjif]
    paths: [.github/workflows/pr108-final-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - name: Fix snapshot dispatch convention and final ADR chrome literals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          picker = Path('bin/tmux-session-picker')
          s = picker.read_text()
          old = '''  nav-snapshot-view)\n  shift\n  [ "$#" -eq 3 ] || die_usage "nav-snapshot-view requires <flat> <chain> <query>"\n  nav_snapshot_view "$@"\n  exit $?\n  ;;\nnav-snapshot-refresh)\n  shift\n  [ "$#" -eq 5 ] || die_usage "nav-snapshot-refresh requires <flat> <chain> <single|multi> <active|all|waiting|running> <query>"\n  nav_snapshot_refresh "$@"\n  exit $?\n  ;;\n'''
          new = '''  nav-snapshot-view)\n    shift\n    [ "$#" -eq 3 ] || die_usage "nav-snapshot-view requires <flat> <chain> <query>"\n    nav_snapshot_view "$@"\n    exit $?\n    ;;\n  nav-snapshot-refresh)\n    shift\n    [ "$#" -eq 5 ] || die_usage "nav-snapshot-refresh requires <flat> <chain> <single|multi> <active|all|waiting|running> <query>"\n    nav_snapshot_refresh "$@"\n    exit $?\n    ;;\n'''
          if old not in s:
              raise SystemExit('snapshot dispatch block did not match expected current head')
          picker.write_text(s.replace(old, new, 1))

          adr = Path('docs/design/adr/adr001-xtmux-nav.md')
          a = adr.read_text()
          replacements = {
              'subtracts eight cells for fzf border/selection chrome': 'subtracts four cells for the borderless fzf selection/marker gutter',
              '› current fzf selection': '> current fzf selection',
              'Pane location (repo, `repo · relative-path`, worktree → canonical repo': 'Pane location (repo, filesystem-style `repo/path`, worktree → canonical repo',
          }
          for old_text, new_text in replacements.items():
              if old_text not in a:
                  raise SystemExit(f'ADR expected text missing: {old_text}')
              a = a.replace(old_text, new_text, 1)
          adr.write_text(a)
          PY
          bash -n bin/tmux-session-picker
          git diff --check
          bash test/contract.sh
      - name: Commit patch and self-remove workflow
        run: |
          git rm .github/workflows/pr108-final-patch.yml
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add bin/tmux-session-picker docs/design/adr/adr001-xtmux-nav.md
          git commit -m 'fix(nav): reconcile snapshot dispatch and final docs'
          git push origin HEAD:xt/xjif
