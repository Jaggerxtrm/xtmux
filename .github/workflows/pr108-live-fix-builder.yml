name: PR 108 retained live-query validation

on:
  push:
    branches:
      - automation/pr108-live-fix-20260820-03

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed fixes
        id: patch
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr108-results
          python3 scripts/pr108-live-fix-builder.py > /tmp/pr108-results/patch.log 2>&1
          rc=$?
          cat /tmp/pr108-results/patch.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Materialize immutable product candidate
        id: materialize
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr108-results
          rm -f .github/workflows/pr108-live-fix-builder.yml
          rm -f scripts/pr108-live-fix-builder.py
          git add -A
          git diff --cached --check > /tmp/pr108-results/diff-check.log 2>&1
          diff_rc=$?
          if [ "$diff_rc" -eq 0 ]; then
            git -c user.name='xtmux automation' \
                -c user.email='actions@users.noreply.github.com' \
                commit -m 'fix(nav): keep fuzzy query state live' \
                > /tmp/pr108-results/materialize.log 2>&1
            rc=$?
          else
            rc=$diff_rc
            cat /tmp/pr108-results/diff-check.log > /tmp/pr108-results/materialize.log
          fi
          cat /tmp/pr108-results/materialize.log
          if [ "$rc" -eq 0 ]; then
            git push origin HEAD:"refs/heads/$GITHUB_REF_NAME" \
              >> /tmp/pr108-results/materialize.log 2>&1
            rc=$?
          fi
          sha=''
          if [ "$rc" -eq 0 ]; then sha="$(git rev-parse HEAD)"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > /tmp/pr108-results/product-commit.txt
          exit 0

      - uses: oven-sh/setup-bun@v2
        id: bun
        if: steps.patch.outputs.rc == '0' && steps.materialize.outputs.rc == '0'
        continue-on-error: true

      - name: Install test prerequisites
        id: deps
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr108-results
          rc=0
          if [ "${{ steps.patch.outputs.rc }}" != '0' ] \
            || [ "${{ steps.materialize.outputs.rc }}" != '0' ] \
            || [ "${{ steps.bun.outcome }}" != 'success' ]; then
            rc=1
            printf 'dependency setup skipped: patch=%s materialize=%s bun=%s\n' \
              '${{ steps.patch.outputs.rc }}' \
              '${{ steps.materialize.outputs.rc }}' \
              '${{ steps.bun.outcome }}' \
              > /tmp/pr108-results/deps.log
          else
            {
              sudo apt-get update
              sudo apt-get install -y tmux jq
              bun install --frozen-lockfile
            } > /tmp/pr108-results/deps.log 2>&1
            rc=$?
          fi
          cat /tmp/pr108-results/deps.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate the complete candidate checkout
        id: validate
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr108-results
          status=0
          if [ "${{ steps.patch.outputs.rc }}" != '0' ] \
            || [ "${{ steps.materialize.outputs.rc }}" != '0' ] \
            || [ "${{ steps.bun.outcome }}" != 'success' ] \
            || [ "${{ steps.deps.outputs.rc }}" != '0' ]; then
            status=1
          else
            run_check() {
              local name="$1"
              shift
              echo "::group::$name"
              "$@" >"/tmp/pr108-results/${name}.log" 2>&1
              local rc=$?
              cat "/tmp/pr108-results/${name}.log"
              echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then
                status=1
                printf '%s\t%s\n' "$name" "$rc" >> /tmp/pr108-results/failures.tsv
              fi
            }
            run_check shell-syntax bash -n bin/tmux-session-picker
            run_check nav-contract bash test/nav-contract.sh
            run_check shell-contract bash test/contract.sh
            run_check json-api-gate bash scripts/verify-json-api.sh
            run_check tracked-drift git diff --exit-code
            run_check staged-drift git diff --cached --exit-code
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit machine-readable validation evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p .xtrm/reports /tmp/pr108-results
          {
            printf 'base=%s\n' 'fdcc1208b01f55d03c972057d65dc2e877dfa2f6'
            printf 'product_commit=%s\n' '${{ steps.materialize.outputs.sha }}'
            printf 'patch_rc=%s\n' '${{ steps.patch.outputs.rc }}'
            printf 'materialize_rc=%s\n' '${{ steps.materialize.outputs.rc }}'
            printf 'bun_outcome=%s\n' '${{ steps.bun.outcome }}'
            printf 'deps_rc=%s\n' '${{ steps.deps.outputs.rc }}'
            printf 'validation_status=%s\n' '${{ steps.validate.outputs.status }}'
            if [ -s /tmp/pr108-results/failures.tsv ]; then
              printf 'failures:\n'
              sed 's/[[:space:]]*$//' /tmp/pr108-results/failures.tsv
            fi
            if [ "${{ steps.patch.outputs.rc }}" != '0' ]; then
              printf 'patch_log:\n'
              sed 's/[[:space:]]*$//' /tmp/pr108-results/patch.log | head -100
            fi
            if [ "${{ steps.deps.outputs.rc }}" != '0' ]; then
              printf 'deps_log:\n'
              sed 's/[[:space:]]*$//' /tmp/pr108-results/deps.log | head -100
            fi
          } > .xtrm/reports/pr108-live-fix-builder-status.txt
          git add .xtrm/reports/pr108-live-fix-builder-status.txt
          git -c user.name='xtmux automation' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m 'build(pr108): record isolated validation evidence' \
              > /tmp/pr108-results/evidence.log 2>&1
          rc=$?
          cat /tmp/pr108-results/evidence.log
          if [ "$rc" -eq 0 ]; then
            git push origin HEAD:"refs/heads/$GITHUB_REF_NAME" \
              >> /tmp/pr108-results/evidence.log 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr108-live-fix-tree-retained-v3
          path: /tmp/pr108-results/
          if-no-files-found: error

      - name: Enforce validation result
        if: steps.validate.outputs.status != '0' || steps.evidence.outputs.rc != '0'
        run: exit 1
