name: PR 108 retained live-query builder

on:
  push:
    branches:
      - automation/pr108-live-fix-20260820-02

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the reviewed fixes
        id: patch
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr108-results
          python3 scripts/pr108-live-fix-builder.py > /tmp/pr108-results/patch.log 2>&1
          rc=$?
          cat /tmp/pr108-results/patch.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: oven-sh/setup-bun@v2

      - name: Install test prerequisites
        id: deps
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq
          bun install --frozen-lockfile

      - name: Validate the complete checkout
        id: validate
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pr108-results
          status=0
          if [ "${{ steps.patch.outputs.rc }}" != '0' ] || [ "${{ steps.deps.outcome }}" != 'success' ]; then
            status=1
          else
            run_check() {
              local name="$1"
              shift
              echo "::group::$name"
              "$@" >"/tmp/pr108-results/${name}.log" 2>&1
              local rc=$?
              cat "/tmp/pr108-results/${name}.log"
              echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then
                status=1
                printf '%s\t%s\n' "$name" "$rc" >> /tmp/pr108-results/failures.tsv
              fi
            }
            run_check shell-syntax bash -n bin/tmux-session-picker
            run_check nav-contract bash test/nav-contract.sh
            run_check shell-contract bash test/contract.sh
            run_check json-api-gate bash scripts/verify-json-api.sh
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Materialize product tree and validation evidence
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/pr108-live-fix-builder.yml
          rm -f scripts/pr108-live-fix-builder.py
          mkdir -p .xtrm/reports
          {
            printf 'base=%s\n' 'fdcc1208b01f55d03c972057d65dc2e877dfa2f6'
            printf 'patch_rc=%s\n' '${{ steps.patch.outputs.rc }}'
            printf 'deps_outcome=%s\n' '${{ steps.deps.outcome }}'
            printf 'validation_status=%s\n' '${{ steps.validate.outputs.status }}'
            if [ -s /tmp/pr108-results/failures.tsv ]; then
              printf 'failures:\n'
              sed 's/[[:space:]]*$//' /tmp/pr108-results/failures.tsv
            fi
            if [ "${{ steps.patch.outputs.rc }}" != '0' ]; then
              printf 'patch_log:\n'
              sed 's/[[:space:]]*$//' /tmp/pr108-results/patch.log | head -80
            fi
          } > .xtrm/reports/pr108-live-fix-builder-status.txt
          git add -A
          git diff --cached --check
          git diff --cached --stat | tee /tmp/pr108-results/diff-stat.txt
          git -c user.name='xtmux automation' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m 'fix(nav): keep fuzzy query state live'
          git push origin HEAD:"refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD | tee /tmp/pr108-results/patched-commit.txt
          git diff --binary fdcc1208b01f55d03c972057d65dc2e877dfa2f6 HEAD \
            > /tmp/pr108-results/final.patch
          git show --format=fuller --stat HEAD > /tmp/pr108-results/commit.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr108-live-fix-tree-retained
          path: /tmp/pr108-results/
          if-no-files-found: error

      - name: Enforce validation result
        if: steps.validate.outputs.status != '0'
        run: exit 1
