name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: node --test packages/xtmux-view/test/*.test.mjs
      - run: bun run test:installer
      - run: bun run typecheck

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux jq
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-json-api.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: json-api-gate-artifacts
          path: /tmp/xtmux-json-gate-*/

  pr108-finalfix:
    name: pr108-finalfix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - name: Apply deterministic final remediation
        run: |
          python3 scripts/pr108-finalfix.py
          bash -n bin/tmux-session-picker test/nav-contract.sh test/nav-real-tmux.sh
          git diff --check
      - name: Commit final remediation and remove coordinator machinery
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/pr108-finalfix.py
          rm -f .github/workflows/pr108-patch2.yml .github/workflows/pr108-finalfix.yml .github/workflows/pr108-finalize.yml
          rm -f .xtrm/pr108-finalize-trigger .xtrm/pr108-ci-finalfix-trigger
          mkdir -p .xtrm
          printf '%s\n' '# PR #108 final web-coordinator integration' '' '- non-current pane occurrence validation uses exact session-scoped pane membership; never session:%pane' '- fuzzy query changes switch local flat/ancestry NUL snapshots and perform no live inventory rebuild' '- initial nav open keeps the established list-active-nav[-single] process boundary' '- temporary coordinator workflows/scripts removed before commit' '- PR remains unmerged pending exact-head standard CI' > .xtrm/pr108-final-integration.md
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nav): finalize snapshot search and pane occurrence validation'
          git push origin HEAD:xt/xjif
