name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: node --test packages/xtmux-view/test/*.test.mjs
      - run: bun run test:installer
      - run: bun run typecheck

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux jq
      - run: bun install --frozen-lockfile
      # Project's own gate: build + binary-freshness + tests + typecheck
      # + shell contracts + v1 fixtures + live tmux smoke of the --json surface.
      - run: bash scripts/verify-json-api.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: json-api-gate-artifacts
          path: /tmp/xtmux-json-gate-*/

  pr108-finalfix:
    name: pr108-finalfix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux fzf util-linux
      - name: Patch final integration and verify nav contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          picker=Path('bin/tmux-session-picker')
          s=picker.read_text()
          added='  list-active-nav-single, list-active-nav-chain, list-active-nav-single-chain,\n  nav-snapshot-view, nav-snapshot-refresh\n'
          original='  list-active-nav-single, list-active-nav-chain, list-active-nav-single-chain\n'
          if added in s:
              s=s.replace(added, original, 1)
          elif original not in s:
              raise SystemExit('internal help anchor missing')

          old='    picker_state_read filter || true; spec="$REPLY"\n    read_list_mode\n    build_list "$spec" "$REPLY" nav "$lines" > "$flat_file"\n    nav_snapshot_project_stream "$flat_file" "$lines" > "$chain_file"'
          new='    # Initial open performs one ordinary live projection. Query changes below\n    # never return to live inventory; they switch between local snapshots.\n    if [ "$lines" = single ]; then\n      "$self" list-active-nav-single > "$flat_file"\n    else\n      "$self" list-active-nav > "$flat_file"\n    fi\n    nav_snapshot_project_stream "$flat_file" "$lines" > "$chain_file"'
          if old in s:
              s=s.replace(old,new,1)
          elif '"$self" list-active-nav > "$flat_file"' not in s:
              raise SystemExit('initial projection anchor missing')
          s=s.replace('then atomically replace both files before output.', 'then replace both temp-backed files before output.', 1)
          picker.write_text(s)

          test=Path('test/nav-contract.sh')
          t=test.read_text()
          old='''if grep -qF "list-active-nav-single-chain '{q}'" "$WORK/nav-fzf-args-oneline"; then
  ok "nav chrome: oneline fallback binds its own single-line chain source"
else
  nok "nav chrome: oneline fallback misses its single-line chain source"
fi'''
          new='''if grep -qF "nav-snapshot-view" "$WORK/nav-fzf-args-oneline" \\
  && ! grep -qF "list-active-nav-single-chain '{q}'" "$WORK/nav-fzf-args-oneline"; then
  ok "nav chrome: oneline fallback also uses the local snapshot source"
else
  nok "nav chrome: oneline fallback is not snapshot-backed"
fi'''
          if old in t:
              t=t.replace(old,new,1)
          elif 'oneline fallback also uses the local snapshot source' not in t:
              raise SystemExit('oneline assertion anchor missing')

          needle='''      list-panes)
        printf '%b\\n' \\
          '$42\\tprogram\\t%901\\tpi\\t2000\\tneeds-input\\t901\\t-' \\
          '$42\\tprogram\\t%553\\tclaude\\t1500\\tdone\\t553\\t-' \\
          '$42\\tprogram\\t%875\\tclaude\\t1000\\tdone\\t875\\t-'
        ;;'''
          replacement='''      list-panes)
        case "$*" in
          *'#{session_name}'*)
            printf '%b\\n' \\
              '$42\\tprogram\\t%901\\tpi\\t2000\\tneeds-input\\t901\\t-' \\
              '$42\\tprogram\\t%553\\tclaude\\t1500\\tdone\\t553\\t-' \\
              '$42\\tprogram\\t%875\\tclaude\\t1000\\tdone\\t875\\t-'
            ;;
          *) printf '%s\\n' '%901' '%553' '%875' ;;
        esac
        ;;'''
          if needle in t:
              t=t.replace(needle,replacement,1)
          elif "*) printf '%s\\n' '%901' '%553' '%875' ;;" not in t:
              raise SystemExit('attention shim anchor missing')

          marker='> "$WORK/t30-dispatch"'
          pos=t.index(marker); start=t.rfind('tmux() {',0,pos); end=t.index('\n}',start)+2
          block=t[start:end]
          if 'list-panes -s -t $26' not in block:
              c='  case "$*" in\n'; at=block.index(c)+len(c)
              block=block[:at]+"    *'list-panes -s -t $26'*) printf '%%553\\n' ;;\n"+block[at:]
              t=t[:start]+block+t[end:]

          marker='> "$WORK/t32-navgo"'
          pos=t.index(marker); start=t.rfind('tmux() {',0,pos); end=t.index('\n}',start)+2
          block=t[start:end]
          if 'list-panes)' not in block:
              c='  case "$1" in\n'; at=block.index(c)+len(c)
              block=block[:at]+"    list-panes) printf '%%1\\n' ;;\n"+block[at:]
              t=t[:start]+block+t[end:]
          test.write_text(t)
          PY

          bash -n bin/tmux-session-picker test/nav-contract.sh test/nav-real-tmux.sh
          bash test/nav-contract.sh
          bash test/nav-real-tmux.sh
          bash test/contract.sh
          git diff --check
      - name: Commit final integration without temporary CI machinery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/pr108-patch2.yml .github/workflows/pr108-finalfix.yml .github/workflows/pr108-finalize.yml
          rm -f .xtrm/pr108-finalize-trigger
          mkdir -p .xtrm
          cat > .xtrm/pr108-final-integration.md <<'EOF'
          # PR #108 final web-coordinator integration

          - non-current pane occurrence validation: session-scoped exact pane membership; never `session:%pane`
          - fuzzy query path: local flat/ancestry NUL snapshots; no live tmux/git rebuild per query change
          - initial nav open keeps the existing `list-active-nav[-single]` process boundary
          - legacy action shims updated for the action-time pane-membership read
          - nav-contract, real-tmux, shell-contract, bash syntax, and diff checks passed before this commit
          - temporary coordinator workflows removed before commit
          - PR intentionally remains unmerged for exact-head standard CI/review
          EOF
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nav): finalize snapshot search and pane occurrence validation'
          git push origin HEAD:xt/xjif
