name: PR108 sentinel
on:
  push:
    branches: [xt/xjif]
    paths: [.github/workflows/pr108-sentinel.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - name: Probe and commit
        run: |
          printf 'sentinel ran at %s\n' "$(date -u +%FT%TZ)" > .xtrm/pr108-sentinel.txt
          git rm .github/workflows/pr108-sentinel.yml
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add .xtrm/pr108-sentinel.txt
          git commit -m 'chore(pr108): confirm coordinator workflow execution'
          git push origin HEAD:xt/xjif
