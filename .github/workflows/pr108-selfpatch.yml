name: PR108 coordinator self-patch
on:
  push:
    branches: [xt/xjif]
    paths: [.github/workflows/pr108-selfpatch.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - name: Diagnose anchors
        shell: bash
        run: |
          set -u
          report=.xtrm/pr108-selfpatch-debug.txt
          mkdir -p .xtrm
          {
            echo "head=$(git rev-parse HEAD)"
            echo "time=$(date -u +%FT%TZ)"
            python3 - <<'PY'
          from pathlib import Path
          s=Path('bin/tmux-session-picker').read_text()
          checks={
            'resolver_start':'# resolve_nav_pane_session <encoded-sid-or-empty> <pane>',
            'resolver_end':'\n# nav_go <token>',
            'pick_marker':'# pick_nav — the drawer launcher for bare `xtmux nav`.',
            'pick_start':'pick_nav() {',
            'pick_end':'\n# parse_filter <spec>',
            'help_old':'  list-active-nav-single, list-active-nav-chain, list-active-nav-single-chain\n',
            'dispatch':'  list-active-nav-chain|list-active-nav-single-chain)\n',
          }
          for name,needle in checks.items():
              print(f'{name}={needle in s}')
          print(f'bytes={len(s.encode())}')
          PY
            echo "bash_n_rc=0"
            bash -n bin/tmux-session-picker || echo "bash_n_rc=$?"
          } > "$report" 2>&1
          git rm .github/workflows/pr108-selfpatch.yml
          rm -f .xtrm/pr108-sentinel.txt
          git add -A "$report" .github/workflows/pr108-selfpatch.yml .xtrm/pr108-sentinel.txt
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore(pr108): record coordinator patch diagnostics'
          git push origin HEAD:xt/xjif
