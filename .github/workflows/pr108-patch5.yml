name: PR108 snapshot compatibility patch
on:
  push:
    branches: [xt/xjif]
    paths:
      - .github/workflows/pr108-patch5.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - name: Patch launcher compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p=Path('bin/tmux-session-picker'); s=p.read_text()
          old='''    picker_state_read filter || true; spec="$REPLY"\n    read_list_mode\n    build_list "$spec" "$REPLY" nav "$lines" > "$flat_file"\n    nav_snapshot_project_stream "$flat_file" "$lines" > "$chain_file"'''
          new='''    # Keep the existing initial-list process boundary: this preserves the\n    # launcher's persisted-filter semantics and testability. Only the fzf\n    # change event is forbidden from returning to live inventory.\n    if [ "$lines" = single ]; then\n      "$self" list-active-nav-single > "$flat_file"\n    else\n      "$self" list-active-nav > "$flat_file"\n    fi\n    nav_snapshot_project_stream "$flat_file" "$lines" > "$chain_file"'''
          if old not in s: raise SystemExit('initial-list anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('test/nav-contract.sh'); s=p.read_text()
          old='''if grep -qF "list-active-nav-single-chain '{q}'" "$WORK/nav-fzf-args-oneline"; then\n  ok "nav chrome: oneline fallback binds its own single-line chain source"\nelse\n  nok "nav chrome: oneline fallback misses its single-line chain source"\nfi'''
          new='''if grep -qF "nav-snapshot-view" "$WORK/nav-fzf-args-oneline" \\
  && ! grep -qF "list-active-nav-single-chain '{q}'" "$WORK/nav-fzf-args-oneline"; then\n  ok "nav chrome: oneline fallback also uses the local snapshot source"\nelse\n  nok "nav chrome: oneline fallback is not snapshot-backed"\nfi'''
          if old not in s: raise SystemExit('oneline assertion anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bash -n bin/tmux-session-picker test/nav-contract.sh
          git diff --check
      - name: Commit patch
        run: |
          git rm .github/workflows/pr108-patch5.yml
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add bin/tmux-session-picker test/nav-contract.sh
          git commit -m 'fix(nav): preserve initial list boundary with snapshots'
          git push origin HEAD:xt/xjif
