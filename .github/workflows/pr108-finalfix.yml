name: PR108 final self-reporting integration
on:
  push:
    branches: [xt/xjif]
    paths: [.github/workflows/pr108-finalfix.yml]
permissions:
  contents: write
jobs:
  finalfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xt/xjif
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux fzf util-linux
      - name: Patch, test, and always publish a result
        shell: bash
        run: |
          set +e
          mkdir -p .xtrm
          log=.xtrm/pr108-finalfix.log
          python3 >"$log" 2>&1 <<'PY'
          from pathlib import Path

          picker=Path('bin/tmux-session-picker')
          s=picker.read_text()

          # Private snapshot plumbing is not a user-facing command surface.
          added='  list-active-nav-single, list-active-nav-chain, list-active-nav-single-chain,\n  nav-snapshot-view, nav-snapshot-refresh\n'
          original='  list-active-nav-single, list-active-nav-chain, list-active-nav-single-chain\n'
          if added in s:
              s=s.replace(added, original, 1)
          elif original not in s:
              raise SystemExit('internal help anchor missing')

          # Keep the established one-live-build initial list boundary. Only fzf
          # query changes are snapshot-local.
          old='    picker_state_read filter || true; spec="$REPLY"\n    read_list_mode\n    build_list "$spec" "$REPLY" nav "$lines" > "$flat_file"\n    nav_snapshot_project_stream "$flat_file" "$lines" > "$chain_file"'
          new='    # Initial open performs one ordinary live projection. Query changes below\n    # never return to live inventory; they switch between local snapshots.\n    if [ "$lines" = single ]; then\n      "$self" list-active-nav-single > "$flat_file"\n    else\n      "$self" list-active-nav > "$flat_file"\n    fi\n    nav_snapshot_project_stream "$flat_file" "$lines" > "$chain_file"'
          if old in s:
              s=s.replace(old,new,1)
          elif '"$self" list-active-nav > "$flat_file"' not in s:
              raise SystemExit('initial projection anchor missing')
          s=s.replace('then atomically replace both files before output.', 'then replace both temp-backed files before output.', 1)
          picker.write_text(s)

          test=Path('test/nav-contract.sh')
          t=test.read_text()

          # One-line fallback uses the same local snapshot query source.
          old='''if grep -qF "list-active-nav-single-chain '{q}'" "$WORK/nav-fzf-args-oneline"; then
  ok "nav chrome: oneline fallback binds its own single-line chain source"
else
  nok "nav chrome: oneline fallback misses its single-line chain source"
fi'''
          new='''if grep -qF "nav-snapshot-view" "$WORK/nav-fzf-args-oneline" \\
  && ! grep -qF "list-active-nav-single-chain '{q}'" "$WORK/nav-fzf-args-oneline"; then
  ok "nav chrome: oneline fallback also uses the local snapshot source"
else
  nok "nav chrome: oneline fallback is not snapshot-backed"
fi'''
          if old in t:
              t=t.replace(old,new,1)
          elif 'oneline fallback also uses the local snapshot source' not in t:
              raise SystemExit('oneline assertion anchor missing')

          # Attention action shim: serve rich rows to attn_list and bare pane ids
          # to resolve_nav_pane_session.
          needle='''      list-panes)
        printf '%b\\n' \\
          '$42\\tprogram\\t%901\\tpi\\t2000\\tneeds-input\\t901\\t-' \\
          '$42\\tprogram\\t%553\\tclaude\\t1500\\tdone\\t553\\t-' \\
          '$42\\tprogram\\t%875\\tclaude\\t1000\\tdone\\t875\\t-'
        ;;'''
          replacement='''      list-panes)
        case "$*" in
          *'#{session_name}'*)
            printf '%b\\n' \\
              '$42\\tprogram\\t%901\\tpi\\t2000\\tneeds-input\\t901\\t-' \\
              '$42\\tprogram\\t%553\\tclaude\\t1500\\tdone\\t553\\t-' \\
              '$42\\tprogram\\t%875\\tclaude\\t1000\\tdone\\t875\\t-'
            ;;
          *) printf '%s\\n' '%901' '%553' '%875' ;;
        esac
        ;;'''
          if needle in t:
              t=t.replace(needle,replacement,1)
          elif "*) printf '%s\\n' '%901' '%553' '%875' ;;" not in t:
              raise SystemExit('attention list-panes shim anchor missing')

          # Hosted dispatch fixture: exact membership for p:$26:%553.
          marker='> "$WORK/t30-dispatch"'
          pos=t.index(marker)
          start=t.rfind('tmux() {',0,pos)
          end=t.index('\n}',start)+2
          block=t[start:end]
          if 'list-panes -s -t $26' not in block:
              casepos=block.index('  case "$*" in\n')+len('  case "$*" in\n')
              block=block[:casepos]+"    *'list-panes -s -t $26'*) printf '%%553\\n' ;;\n"+block[casepos:]
              t=t[:start]+block+t[end:]

          # §32 nav-go fixture: exact membership for p:$1:%1.
          marker='> "$WORK/t32-navgo"'
          pos=t.index(marker)
          start=t.rfind('tmux() {',0,pos)
          end=t.index('\n}',start)+2
          block=t[start:end]
          if 'list-panes)' not in block:
              casepos=block.index('  case "$1" in\n')+len('  case "$1" in\n')
              block=block[:casepos]+"    list-panes) printf '%%1\\n' ;;\n"+block[casepos:]
              t=t[:start]+block+t[end:]

          test.write_text(t)
          print('patch integration applied')
          PY
          patch_rc=$?

          if [ "$patch_rc" -eq 0 ]; then
            bash -n bin/tmux-session-picker test/nav-contract.sh test/nav-real-tmux.sh >>"$log" 2>&1
            patch_rc=$?
          fi
          if [ "$patch_rc" -eq 0 ]; then
            bash test/nav-contract.sh >>"$log" 2>&1
            nav_rc=$?
            echo "nav_contract_rc=$nav_rc" >>"$log"
            [ "$nav_rc" -eq 0 ] || patch_rc=$nav_rc
          fi
          if [ "$patch_rc" -eq 0 ]; then
            bash test/nav-real-tmux.sh >>"$log" 2>&1
            real_rc=$?
            echo "real_tmux_rc=$real_rc" >>"$log"
            [ "$real_rc" -eq 0 ] || patch_rc=$real_rc
          fi
          if [ "$patch_rc" -eq 0 ]; then
            bash test/contract.sh >>"$log" 2>&1
            contract_rc=$?
            echo "contract_rc=$contract_rc" >>"$log"
            [ "$contract_rc" -eq 0 ] || patch_rc=$contract_rc
          fi
          git diff --check >>"$log" 2>&1 || patch_rc=$?
          echo "FINAL_RC=$patch_rc" >>"$log"

          # Remove every coordinator-only runner/trigger from the branch.
          git rm -f .github/workflows/pr108-finalfix.yml >/dev/null 2>&1 || true
          git rm -f .github/workflows/pr108-finalize.yml >/dev/null 2>&1 || true
          git rm -f .xtrm/pr108-finalize-trigger >/dev/null 2>&1 || true
          git config user.name 'xtrm web coordinator'
          git config user.email 'actions@users.noreply.github.com'

          if [ "$patch_rc" -eq 0 ]; then
            git add bin/tmux-session-picker test/nav-contract.sh .xtrm/pr108-finalfix.log
            git commit -m 'fix(nav): integrate snapshot search with action contracts'
          else
            git restore bin/tmux-session-picker test/nav-contract.sh
            git add .xtrm/pr108-finalfix.log
            git commit -m 'chore(pr108): record final integration failure'
          fi
          git push origin HEAD:xt/xjif
          exit 0
